<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Risk Analytics</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; background: #f4f6f8; color: #1f2933;
           margin: 0; padding: 24px; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .note { color: #52606d; font-size: .9rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
             gap: 12px; margin: 16px 0; }
    .card, .panel { background: #fff; border-radius: 10px; padding: 14px 16px;
                    box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .card .label { color: #52606d; font-size: .85rem; }
    .card .value { font-size: 1.5rem; font-weight: 600; margin-top: 4px; }
    .panel { margin-top: 16px; }
    .panel h2 { margin: 0 0 8px; font-size: 1.05rem; }
    svg { width: 100%; height: auto; display: block; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: right; padding: 8px; border-bottom: 1px solid #e4e7eb; }
    th:first-child, td:first-child { text-align: left; }
    .error { color: #b42318; }
  </style>
</head>
<body>
<main>
  <h1>Trading Risk Analytics</h1>
  <p class="note">Simulated prices for fictional stocks, not real market data.</p>
  <div id="error" class="error"></div>

  <div class="cards" id="cards"></div>

  <div class="panel"><h2>Portfolio value</h2><div id="valueChart"></div></div>
  <div class="panel"><h2>Drawdown from peak</h2><div id="drawdownChart"></div></div>

  <div class="panel">
    <h2>Holdings</h2>
    <table>
      <thead><tr><th>Symbol</th><th>Quantity</th><th>Latest close</th>
        <th>Market value</th><th>Weight</th></tr></thead>
      <tbody id="holdings"></tbody>
    </table>
  </div>
</main>

<script>
  const SVG_NS = "http://www.w3.org/2000/svg";
  const money = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  const pct = (x) => (x * 100).toFixed(2) + "%";

  function svg(tag, attrs, text) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // Draws a simple line chart of {date, <key>} points into the container.
  function lineChart(container, points, key, format, color) {
    const W = 800, H = 260, L = 70, R = 20, T = 15, B = 30;
    const values = points.map((p) => p[key]);
    let min = Math.min(...values), max = Math.max(...values);
    if (min === max) { min -= 1; max += 1; }
    const x = (i) => L + (i / (points.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);

    const chart = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
    chart.appendChild(svg("line", { x1: L, y1: T, x2: L, y2: H - B, stroke: "#9aa5b1" }));
    chart.appendChild(svg("line", { x1: L, y1: H - B, x2: W - R, y2: H - B, stroke: "#9aa5b1" }));
    chart.appendChild(svg("text", { x: L - 8, y: T + 4, "text-anchor": "end",
                                    "font-size": 12, fill: "#52606d" }, format(max)));
    chart.appendChild(svg("text", { x: L - 8, y: H - B, "text-anchor": "end",
                                    "font-size": 12, fill: "#52606d" }, format(min)));
    chart.appendChild(svg("text", { x: L, y: H - 8, "font-size": 12, fill: "#52606d" },
                          points[0].date));
    chart.appendChild(svg("text", { x: W - R, y: H - 8, "text-anchor": "end",
                                    "font-size": 12, fill: "#52606d" },
                          points[points.length - 1].date));
    const line = points.map((p, i) => x(i).toFixed(1) + "," + y(p[key]).toFixed(1)).join(" ");
    chart.appendChild(svg("polyline", { points: line, fill: "none", stroke: color,
                                        "stroke-width": 2 }));
    container.replaceChildren(chart);
  }

  function addCard(parent, label, value) {
    const card = document.createElement("div");
    card.className = "card";
    const l = document.createElement("div");
    l.className = "label"; l.textContent = label;
    const v = document.createElement("div");
    v.className = "value"; v.textContent = value;
    card.append(l, v);
    parent.appendChild(card);
  }

  function addRow(body, cells) {
    const tr = document.createElement("tr");
    for (const text of cells) {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }

  async function getJson(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(url + " returned " + response.status);
    return response.json();
  }

  async function load() {
    try {
      const [summary, value, drawdown, holdings] = await Promise.all([
        getJson("/summary"), getJson("/portfolio/value"),
        getJson("/portfolio/drawdown"), getJson("/holdings"),
      ]);

      const cards = document.getElementById("cards");
      addCard(cards, "Annualized volatility", pct(summary.annualized_volatility));
      addCard(cards, "1-day VaR (95%)", pct(summary.var_95));
      addCard(cards, "1-day VaR (99%)", pct(summary.var_99));
      addCard(cards, "Maximum drawdown", pct(summary.max_drawdown));

      lineChart(document.getElementById("valueChart"), value, "value",
                (v) => money.format(v), "#1f6feb");
      lineChart(document.getElementById("drawdownChart"), drawdown, "drawdown",
                pct, "#b42318");

      const body = document.getElementById("holdings");
      for (const h of holdings) {
        addRow(body, [h.symbol, h.quantity, h.latest_close.toFixed(2),
                      money.format(h.market_value), pct(h.weight)]);
      }
    } catch (error) {
      document.getElementById("error").textContent =
        "Could not load data: " + error.message;
    }
  }
  load();
</script>
</body>
</html>
